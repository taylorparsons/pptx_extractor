<svg xmlns="http://www.w3.org/2000/svg" width="420" height="320" viewBox="0 0 420 320" role="img" aria-label="Validate JSON and recreate PPTX">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111B33"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#6EE7FF"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="420" height="320" rx="22" ry="22" fill="url(#bg2)"/>

  <!-- Card -->
  <g transform="translate(36,42)" filter="url(#shadow2)">
    <rect x="0" y="0" rx="18" ry="18" width="348" height="236" fill="#0F172A" stroke="#233052" stroke-width="2"/>

    <!-- Header -->
    <rect x="22" y="20" rx="12" ry="12" width="304" height="44" fill="#0B1020" stroke="#1F2A44" stroke-width="2"/>
    <text x="44" y="48" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="16" fill="#E5E7EB">
      JSON validator
    </text>

    <!-- JSON lines -->
    <g transform="translate(22,84)">
      <rect x="0" y="0" rx="12" ry="12" width="304" height="128" fill="#0B1020" stroke="#1F2A44" stroke-width="2"/>
      <text x="18" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="14" fill="#C7D2FE">
        $.slides[3].shapes[2].type
      </text>
      <text x="18" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="14" fill="#E5E7EB">
        Expected string, got null
      </text>
      <rect x="18" y="74" rx="8" ry="8" width="268" height="10" fill="#111B33"/>
      <rect x="18" y="74" rx="8" ry="8" width="168" height="10" fill="#F87171"/>
      <text x="18" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="14" fill="#C7D2FE">
        OK to recreate once fixed
      </text>
    </g>

    <!-- Footer buttons -->
    <g transform="translate(22,224)">
      <rect x="0" y="0" rx="12" ry="12" width="168" height="44" fill="url(#accent2)"/>
      <text x="22" y="28" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="15" font-weight="700" fill="#0B1220">
        Validate
      </text>
      <rect x="186" y="0" rx="12" ry="12" width="118" height="44" fill="#111B33" stroke="#233052" stroke-width="2"/>
      <text x="206" y="28" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="15" font-weight="700" fill="#E5E7EB">
        Recreate
      </text>
    </g>
  </g>
</svg>

